<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>抖音科普封面 V1 - 暖纸刊物风</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }
  /* 兼容抖音主页 3:4 居中裁切 (y:240..1680) + 信息流右/底部交互避让 */
  .safe {
    position: absolute;
    left: 52px;
    right: 84px;
    top: 266px;
    bottom: 356px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .mono {
    font-family: "SF Mono", "Menlo", "Monaco", Consolas, monospace;
  }
  .serif {
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
  }

  .canvas {
    background:
      radial-gradient(920px 620px at 80% 18%, rgba(217, 91, 56, 0.10), transparent 70%),
      radial-gradient(880px 580px at 18% 82%, rgba(16, 185, 129, 0.08), transparent 72%),
      #F5F1E8;
    color: #18181B;
  }
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(24, 24, 27, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(24, 24, 27, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .eyebrow-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    border-radius: 999px;
    background: #FFFFFF;
    border: 1.5px solid rgba(24, 24, 27, 0.12);
    font-size: 27px;
    font-weight: 700;
    color: #18181B;
    box-shadow: 0 8px 20px -12px rgba(24, 24, 27, 0.25);
  }
  .pill .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.20);
  }
  .pill.sub-tag {
    background: #18181B;
    color: #FAFAF8;
    border-color: #18181B;
    font-size: 24px;
  }
  .title-block {
    margin-top: 8px;
  }
  .h1-top {
    font-size: 112px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: #18181B;
  }
  .h1-bot {
    margin-top: 6px;
    font-size: 102px;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -0.03em;
    color: #D95B38;
    display: inline-block;
    position: relative;
    z-index: 1;
  }
  .h1-bot::after {
    content: "";
    position: absolute;
    left: 0;
    right: 8px;
    bottom: 6px;
    height: 22px;
    background: rgba(251, 191, 36, 0.48);
    z-index: -1;
    border-radius: 6px;
  }
  .lead {
    margin-top: 22px;
    font-size: 36px;
    font-weight: 600;
    color: #52525B;
    line-height: 1.35;
  }
  .bento {
    display: grid;
    grid-template-columns: 452px 468px;
    grid-template-rows: 1fr;
    gap: 24px;
    height: 670px;
    min-height: 0;
  }
  .photo-card {
    background: #FFFFFF;
    border-radius: 28px;
    padding: 16px;
    border: 1.5px solid rgba(24, 24, 27, 0.10);
    box-shadow: 0 28px 50px -24px rgba(24, 24, 27, 0.28);
    display: flex;
    flex-direction: column;
    position: relative;
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .photo-frame {
    position: relative;
    flex: 1;
    min-height: 0;
    border-radius: 20px;
    overflow: hidden;
    background: #E4E4E7;
  }
  .photo-frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 60%;
    transform: scale(1.24);
    transform-origin: 50% 64%;
    display: block;
  }
  .photo-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    background: #DC2626;
    color: #FFFFFF;
    font-size: 24px;
    font-weight: 800;
    padding: 8px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 14px rgba(220, 38, 38, 0.35);
  }
  .photo-foot {
    padding: 16px 8px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 24px;
    font-weight: 700;
    color: #27272A;
  }
  .photo-foot span.tag {
    font-size: 20px;
    color: #047857;
    background: rgba(16, 185, 129, 0.14);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .right-col {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .code-card {
    height: 312px;
    background: #18181B;
    color: #FAFAF8;
    border-radius: 28px;
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 24px 44px -22px rgba(24, 24, 27, 0.45);
  }
  .egg-tag {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 8px;
    background: rgba(16, 185, 129, 0.20);
    color: #34D399;
    border: 1px solid rgba(52, 211, 153, 0.35);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 23px;
    font-weight: 700;
  }
  .egg-main {
    font-size: 40px;
    font-weight: 800;
    line-height: 1.25;
  }
  .egg-main em {
    font-style: normal;
    color: #FDBA74;
  }
  .egg-code {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 22px;
    color: #A7F3D0;
    border: 1px solid rgba(255, 255, 255, 0.10);
  }
  .moto-card {
    flex: 1;
    background: #FFFFFF;
    border-radius: 28px;
    padding: 22px 26px;
    border: 1.5px solid rgba(24, 24, 27, 0.10);
    box-shadow: 0 22px 42px -24px rgba(24, 24, 27, 0.22);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .route-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 24px;
    font-weight: 800;
    color: #18181B;
  }
  .route-dist {
    color: #D95B38;
    font-size: 24px;
  }
  .moto-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 158px;
  }
  .moto-svg {
    width: 270px;
    height: 152px;
  }
  .cost-pill {
    background: #FAF6EE;
    border: 1.5px solid rgba(217, 91, 56, 0.28);
    border-radius: 14px;
    padding: 10px 16px;
    font-size: 23px;
    font-weight: 700;
    color: #18181B;
    text-align: center;
  }
  .cost-pill b {
    color: #DC2626;
  }
  .cost-pill em {
    font-style: normal;
    color: #047857;
  }
  .bottom-pills {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .nav-pill {
    flex: 1;
    text-align: center;
    padding: 18px 12px;
    background: #FFFFFF;
    border: 1.5px solid rgba(24, 24, 27, 0.12);
    border-radius: 20px;
    font-size: 27px;
    font-weight: 800;
    color: #18181B;
    box-shadow: 0 12px 24px -16px rgba(24, 24, 27, 0.25);
  }
</style>
</head>
